services:
  # Frontend (Next.js)
  - type: web
    name: bracketworks-frontend
    env: node
    region: oregon
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://api.bracketworks.app

  # Backend (FastAPI)  
  - type: web
    name: bracketworks-backend
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && chmod +x start.sh && ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: postgresql://bracketworks_database_user:MW0r5GaFvgwfEQ7LLqArlUKOybMlkYLG@dpg-d34bbaripnbc73fqtcng-a.oregon-postgres.render.com/bracketworks_database
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://bracketworks.app,https://www.bracketworks.app
      - key: SENDGRID_API_KEY
        sync: false  # You'll set this manually in Render dashboard for security
      - key: FROM_EMAIL
        value: support@bracketworks.app
      - key: FROM_NAME
        value: BracketWorks

