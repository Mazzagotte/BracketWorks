services:
  # Backend (FastAPI) - Fresh Configuration
  - type: web
    name: bracketworks-api-fresh
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip &&
      pip install fastapi==0.115.2 &&
      pip install uvicorn[standard]==0.30.6 &&
      pip install SQLAlchemy==2.0.35 &&
      pip install psycopg2-binary==2.9.10 &&
      pip install pydantic==2.9.2 &&
      pip install python-multipart==0.0.9 &&
      pip install python-dotenv==1.0.1 &&
      pip install email-validator==2.3.0 &&
      pip install passlib[bcrypt]==1.7.4 &&
      pip install python-jose[cryptography]==3.5.0 &&
      pip install alembic==1.16.5 &&
      pip install typing-extensions==4.15.0 &&
      pip install sendgrid==6.11.0 &&
      echo "All packages installed successfully"
    startCommand: python start_backend.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: postgresql://bracketworks_database_user:MW0r5GaFvgwfEQ7LLqArlUKOybMlkYLG@dpg-d34bbaripnbc73fqtcng-a.oregon-postgres.render.com/bracketworks_database
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://bracketworks.onrender.com,https://www.bracketworks.onrender.com,http://localhost:3000,http://localhost:8000
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: support@bracketworks.app
      - key: FROM_NAME
        value: BracketWorks

  # Frontend (Next.js)
  - type: web
    name: bracketworks-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: yarn install && yarn build
    startCommand: yarn start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://bracketworks-api-fresh.onrender.com