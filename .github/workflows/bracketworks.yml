name: BracketWorks Web CI

on:
  push:
    branches: [main, master]
    paths:
      - apps/bracketworks-web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/bracketworks.yml
  pull_request:
    paths:
      - apps/bracketworks-web/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - .github/workflows/bracketworks.yml

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @bracketworks/bracketworks-web lint

      - name: Typecheck
        run: pnpm --filter @bracketworks/bracketworks-web typecheck

      - name: Test
        run: pnpm --filter @bracketworks/bracketworks-web test

      - name: Build
        run: pnpm --filter @bracketworks/bracketworks-web build
